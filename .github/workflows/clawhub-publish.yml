name: Publish Skill (ClawHub)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OpenCL (nano-rspow-node native dep)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compute ClawHub version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Check whether version is already on ClawHub
        id: clawhub_check
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "CLAWHUB_TOKEN is required to publish to ClawHub"
            exit 1
          fi

          VERSION="${{ steps.version.outputs.version }}"
          echo "Checking ClawHub for nano@$VERSION"

          npx -y clawhub login --token "$CLAWHUB_TOKEN"

          if npx -y clawhub inspect nano --version "$VERSION" --json > clawhub-inspect.json 2> clawhub-inspect.err; then
            EXISTS=$(node -e "const fs=require('fs'); const v=process.argv[1]; const d=JSON.parse(fs.readFileSync('clawhub-inspect.json','utf8')); process.stdout.write(d?.version?.version===v?'true':'false')" "$VERSION")
          else
            EXISTS=false
          fi

          if [ "$EXISTS" = "true" ]; then
            echo "Version nano@$VERSION already exists on ClawHub; skipping publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version nano@$VERSION not found on ClawHub; publish will run."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish Nano skill to ClawHub
        if: steps.clawhub_check.outputs.should_publish == 'true'
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          npx -y clawhub skill publish ./skills/nano \
            --slug nano \
            --name "Nano (XNO)" \
            --owner casualsecurityinc \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "Automated publish from ${GITHUB_SHA}" \
            --tags latest \
            --source-repo "CasualSecurityInc/xno-skills" \
            --source-commit "${GITHUB_SHA}" \
            --source-ref "${GITHUB_REF_NAME}" \
            --source-path "skills/nano"
