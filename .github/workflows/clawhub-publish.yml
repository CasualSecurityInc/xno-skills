name: Publish Skill (ClawHub)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clawhub-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install OpenCL (nano-rspow-node native dep)
        run: sudo apt-get update && sudo apt-get install -y ocl-icd-opencl-dev

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Compute ClawHub version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Publish Nano skill to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_TOKEN" ]; then
            echo "CLAWHUB_TOKEN is required to publish to ClawHub"
            exit 1
          fi

          npx -y clawhub login --token "$CLAWHUB_TOKEN"
          npx -y clawhub skill publish ./skills/nano \
            --slug nano \
            --name "Nano (XNO)" \
            --owner cbrunnkvist \
            --version "${{ steps.version.outputs.version }}" \
            --changelog "Automated publish from ${GITHUB_SHA}" \
            --tags latest
          # TODO: switch to --owner casualsecurityinc once ClawHub deploys PR #2102
          # npx -y clawhub skill publish ./skills/nano \
          #   --slug nano \
          #   --name "Nano (XNO)" \
          #   --owner casualsecurityinc \
          #   --version "${{ steps.version.outputs.version }}" \
          #   --changelog "Automated publish from ${GITHUB_SHA} (${{ steps.version.outputs.desc }})" \
          #   --tags latest
